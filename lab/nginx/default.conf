server {
    listen 80;

    # Docker DNS'i 10 sn'de bir yeniden sor: servis yeniden deploy edilip IP'si değişince 502 olmasın.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $frontend http://frontend:8000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
    }
}
