# İstemci IP'si: k6 sahte X-Forwarded-For gönderir; bu başlığa yalnız Tailscale ağından gelen isteklerde güvenilir.
set_real_ip_from 100.64.0.0/10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Kalibre edildi (5. adım): normal ve kampanya ziyaretçileri IP başına ~1 istek/sn ile takılmaz; tek IP flood ve NAT arkasındaki kampanya takılır.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=8r/s;
limit_req_status 429;

log_format watcher_json escape=json
    '{"msec":"$msec","remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method","path":"$uri","query":"$args","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"bytes_sent":$body_bytes_sent,"user_agent":"$http_user_agent",'
    '"limit_req_status":"$limit_req_status","session":"$cookie_sid"}';

server {
    listen 80;
    # shortcut: log döndürülmüyor; senaryo başına birkaç yüz MB, disk 64 GB. Uzun koşularda logrotate eklenecek.
    access_log /var/log/nginx/access.json watcher_json;

    # Docker DNS'i 10 sn'de bir yeniden sor: servis yeniden deploy edilip IP'si değişince 502 olmasın.
    resolver 127.0.0.11 valid=10s;

    location / {
        limit_req zone=per_ip burst=20 nodelay;
        set $frontend http://frontend:8000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
    }
}
