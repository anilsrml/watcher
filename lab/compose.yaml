# Watcher lab. Çalıştırma: docker --context watcher-vds compose -f lab/compose.yaml --env-file .env up -d --build
# Portlar yalnız LAB_BIND_IP'ye (VPS'in Tailscale IP'si) bağlanır; Docker portları ufw'yi atladığı için 0.0.0.0 kullanılmaz.
name: watcher-lab

x-shop: &shop
  build:
    context: ..
    dockerfile: lab/app/Dockerfile
  image: watcher-shop:dev
  mem_limit: 256m
  restart: unless-stopped

x-shop-env: &shop-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  DATABASE_URL: postgresql://watcher:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/watcher
  REDIS_URL: redis://redis:6379/0

services:
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "${LAB_BIND_IP:?LAB_BIND_IP gerekli}:3000:3000"
    volumes:
      - lgtm-data:/data
    mem_limit: 3g
    restart: unless-stopped

  nginx:
    build: ./nginx
    image: watcher-nginx:dev
    ports:
      - "${LAB_BIND_IP:?LAB_BIND_IP gerekli}:80:80"
    volumes:
      - nginx-logs:/var/log/nginx
    mem_limit: 128m
    restart: unless-stopped

  otel-collector:
    build: ./otel-collector
    image: watcher-otel-collector:dev
    # root: docker.sock (container metrikleri) ve /hostfs (host metrikleri) okunabilsin. Bu bağlamalar VPS'in kendi yollarıdır.
    user: "0:0"
    volumes:
      - nginx-logs:/var/log/nginx:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: watcher
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "watcher"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8.2.10-alpine
    mem_limit: 128m
    restart: unless-stopped

  frontend:
    <<: *shop
    environment:
      <<: *shop-env
      SERVICE: frontend
      OTEL_SERVICE_NAME: frontend

  product:
    <<: *shop
    environment:
      <<: *shop-env
      SERVICE: product
      OTEL_SERVICE_NAME: product
    depends_on:
      postgres:
        condition: service_healthy

  cart:
    <<: *shop
    environment:
      <<: *shop-env
      SERVICE: cart
      OTEL_SERVICE_NAME: cart
    depends_on:
      - redis

  checkout:
    <<: *shop
    environment:
      <<: *shop-env
      SERVICE: checkout
      OTEL_SERVICE_NAME: checkout
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    <<: *shop
    environment:
      <<: *shop-env
      SERVICE: payment
      OTEL_SERVICE_NAME: payment

volumes:
  lgtm-data:
  pg-data:
  nginx-logs:
